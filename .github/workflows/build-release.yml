name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ./src/WindowsShareManager/WindowsShareManager.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "프로젝트 버전을 읽지 못했습니다."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore WindowsShareManager.sln

      - name: Build
        run: dotnet build WindowsShareManager.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet run --project tests/WindowsShareManager.Tests/WindowsShareManager.Tests.csproj --configuration Release --no-build

      - name: Publish portable executable
        shell: pwsh
        run: ./scripts/publish-win-x64.ps1 -OutputDirectory ./artifacts/win-x64

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path ./artifacts/win-x64/* -DestinationPath "./artifacts/WindowsShareManager-v$env:VERSION-win-x64.zip"
          $hash = (Get-FileHash "./artifacts/WindowsShareManager-v$env:VERSION-win-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WindowsShareManager-v$env:VERSION-win-x64.zip" | Set-Content "./artifacts/WindowsShareManager-v$env:VERSION-win-x64.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsShareManager-v${{ steps.version.outputs.version }}-win-x64
          path: |
            artifacts/WindowsShareManager-v${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/WindowsShareManager-v${{ steps.version.outputs.version }}-win-x64.sha256

      - name: Create GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VERSION"
          $PSNativeCommandUseErrorActionPreference = $false
          $ErrorActionPreference = "Continue"
          gh release view $tag 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"
          if (-not $releaseExists) {
            gh release create $tag `
              "./artifacts/WindowsShareManager-v$env:VERSION-win-x64.zip" `
              "./artifacts/WindowsShareManager-v$env:VERSION-win-x64.sha256" `
              --target "$env:GITHUB_SHA" `
              --title "Windows Share Manager $tag" `
              --notes-file ./CHANGELOG.md
          }
